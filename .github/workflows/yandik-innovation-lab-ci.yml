name: YANDIK+ Innovation Lab | Isolated Validation
on:
  push:
    branches:
      - lab/augma-inspired-experiments
    paths:
      - 'experiments/augma-inspired/**'
      - '.github/workflows/yandik-innovation-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation-policy:
    if: github.ref == 'refs/heads/lab/augma-inspired-experiments'
    name: Branch, secret, and production-domain guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on non-lab changes
        run: python3 experiments/augma-inspired/tools/check_lab_isolation.py --base-ref origin/main

  geometry-and-acquisition:
    needs: isolation-policy
    if: github.ref == 'refs/heads/lab/augma-inspired-experiments'
    name: Offline GIS and BNPB mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record immutable branch/run identity (lab only)
        env:
          LAB_JOB_KIND: geometry-and-acquisition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/augma-inspired/qa-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = {
              "schema": "yandik.lab.ci-evidence.v1",
              "branch_ref": os.environ.get("GITHUB_REF"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job_kind": os.environ.get("LAB_JOB_KIND"),
              "data_scope": "SYNTHETIC_AND_OFFLINE_ONLY",
              "approval": "NOT_FOR_PRODUCTION",
          }
          Path("experiments/augma-inspired/qa-evidence/manifest.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Install Shapely (test dependency only)
        run: python -m pip install --disable-pip-version-check 'shapely==2.1.2'
      - name: Syntax and offline mock tests
        working-directory: experiments/augma-inspired
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/audit_adm2.py tools/fetch_bnpb_adm2.py tools/review_adm2_package.py tools/check_lab_isolation.py tools/check_big_adm2_metadata.py tools/verify_ci_evidence.py
          python -m unittest discover -s tools/tests -v 2>&1 | tee qa-evidence/python-tests.log
      - name: Verify downloader stays off by default
        working-directory: experiments/augma-inspired
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/fetch_bnpb_adm2.py --output-dir /tmp/yandik-lab-not-authorized > /tmp/yandik-lab-no-fetch.out 2>&1
          result=$?
          set -e
          test "$result" -eq 2
          test ! -e /tmp/yandik-lab-not-authorized
      - name: Finalize log contract with job result
        if: always()
        env:
          LAB_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          target = Path("experiments/augma-inspired/qa-evidence/manifest.json")
          if target.is_file():
              info = json.loads(target.read_text(encoding="utf-8"))
              info["job_result"] = os.environ.get("LAB_JOB_RESULT", "unknown")
              target.write_text(json.dumps(info, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve source-only GIS test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandik-lab-offline-python-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: experiments/augma-inspired/qa-evidence/

  browser-smoke:
    needs: isolation-policy
    if: github.ref == 'refs/heads/lab/augma-inspired-experiments'
    name: Desktop and mobile viewport browser smoke tests
    # Playwright 1.56.1 Chromium does not support ubuntu-26.04 (ubuntu-latest in Nov 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record immutable branch/run identity (lab only)
        env:
          LAB_JOB_KIND: browser-smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/augma-inspired/qa-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = {
              "schema": "yandik.lab.ci-evidence.v1",
              "branch_ref": os.environ.get("GITHUB_REF"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job_kind": os.environ.get("LAB_JOB_KIND"),
              "data_scope": "SYNTHETIC_AND_OFFLINE_ONLY",
              "approval": "NOT_FOR_PRODUCTION",
          }
          Path("experiments/augma-inspired/qa-evidence/manifest.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Install browser test dependencies (lab only)
        working-directory: experiments/augma-inspired/prototypes
        run: |
          npm install --no-save '@playwright/test@1.56.1'
          npx playwright install --with-deps chromium
      - name: Syntax-check all lab JavaScript modules
        working-directory: experiments/augma-inspired/prototypes
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path '*/node_modules/*' -print0 |
            xargs -0 -r -n 1 node --check
      - name: Run JS unit tests
        working-directory: experiments/augma-inspired/prototypes
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit 2>&1 | tee ../qa-evidence/node-tests.log
      - name: Serve on loopback and run browser tests
        working-directory: experiments/augma-inspired/prototypes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/yandik-lab-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8767/geo-command-center/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8767/geo-command-center/index.html >/dev/null
          npm run test:browser 2>&1 | tee ../qa-evidence/playwright-tests.log
          npm run test:browser:perf > ../qa-evidence/browser-performance.json
          cat ../qa-evidence/browser-performance.json
      - name: Finalize log contract with job result
        if: always()
        env:
          LAB_JOB_RESULT: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          target = Path("experiments/augma-inspired/qa-evidence/manifest.json")
          if target.is_file():
              info = json.loads(target.read_text(encoding="utf-8"))
              info["job_result"] = os.environ.get("LAB_JOB_RESULT", "unknown")
              target.write_text(json.dumps(info, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve failing browser traces and performance sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandik-lab-browser-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            experiments/augma-inspired/prototypes/test-results/
            experiments/augma-inspired/prototypes/playwright-report/
            experiments/augma-inspired/qa-evidence/
            /tmp/yandik-lab-http.log

# This workflow has no deploy, push, write permission, trading API, STB or production connectivity.
